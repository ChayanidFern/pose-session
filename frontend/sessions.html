<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Manager — Neck GT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  body{overflow:auto;padding:28px 20px}
  .page{max-width:900px;margin:0 auto}
  .page-title{font-size:20px;font-weight:700;margin-bottom:4px}
  .page-sub{font-size:12px;color:var(--tx2);margin-bottom:24px}
  .back-link{font-size:12px;color:var(--bfg);text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-bottom:16px}
  .back-link:hover{text-decoration:underline}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .count-badge{font-family:var(--mono);font-size:11px;background:var(--bg3);border:1px solid var(--bdr);border-radius:4px;padding:2px 8px;color:var(--tx2)}
  table{width:100%;border-collapse:collapse;background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;font-size:13px}
  th{background:var(--bg3);font-size:11px;font-weight:600;color:var(--tx2);padding:9px 12px;text-align:left;border-bottom:1px solid var(--bdr);letter-spacing:.04em}
  td{padding:9px 12px;border-bottom:1px solid var(--bdr);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--bg3)}
  .btn-dl{padding:4px 12px;border-radius:6px;border:none;background:var(--green);color:#fff;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer}
  .btn-dl:hover{background:#2EA043}
  .btn-del{padding:4px 10px;border-radius:6px;border:1px solid var(--bdr);background:transparent;color:var(--rfg);font-family:var(--font);font-size:12px;cursor:pointer}
  .btn-del:hover{background:#2D1414}
  .empty{text-align:center;padding:40px;color:var(--tx3);font-size:13px}
  .status-ok{color:var(--gfg);font-size:11px;font-family:var(--mono)}
  .status-err{color:var(--rfg);font-size:11px;font-family:var(--mono)}
  .mono{font-family:var(--mono);font-size:11px;color:var(--tx2)}
</style>
</head>
<body>
<div class="page">
  <a href="index.html" class="back-link">← กลับหน้าหลัก</a>
  <div class="page-title">🗂 Session Manager</div>
  <div class="page-sub">รายการ session ที่บันทึกไว้ใน backend — ดาวน์โหลด Excel ได้เลย</div>

  <div class="toolbar">
    <span id="api-status" class="status-ok">⏳ ตรวจสอบ API...</span>
    <span class="count-badge" id="count-badge">0 sessions</span>
    <button class="btn-ctrl play" style="margin-left:auto;padding:6px 14px;font-size:12px" onclick="loadSessions()">🔄 รีเฟรช</button>
  </div>

  <table id="sessions-table">
    <thead>
      <tr>
        <th>ไฟล์</th>
        <th>ขนาด</th>
        <th>วันที่</th>
        <th></th>
        <th></th>
      </tr>
    </thead>
    <tbody id="sessions-body">
      <tr><td colspan="5" class="empty">⏳ กำลังโหลด...</td></tr>
    </tbody>
  </table>
</div>

<script src="js/api.js"></script>
<script>
async function loadSessions() {
  // check API
  const ok = await apiHealthCheck();
  const statusEl = document.getElementById("api-status");
  statusEl.textContent = ok ? "✅ API Online" : "❌ API Offline";
  statusEl.className   = ok ? "status-ok" : "status-err";

  if (!ok) {
    document.getElementById("sessions-body").innerHTML =
      `<tr><td colspan="5" class="empty">❌ ไม่สามารถเชื่อมต่อ Backend ได้<br><small>ตรวจสอบว่า API กำลัง run อยู่</small></td></tr>`;
    return;
  }

  try {
    const data   = await apiListSessions();
    const tbody  = document.getElementById("sessions-body");
    const badge  = document.getElementById("count-badge");
    badge.textContent = `${data.count} sessions`;

    if (!data.sessions.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">ยังไม่มี session ที่บันทึกไว้</td></tr>`;
      return;
    }

    tbody.innerHTML = data.sessions.map(s => `
      <tr>
        <td class="mono">${s.filename}</td>
        <td class="mono">${s.size_kb} KB</td>
        <td class="mono">${s.created}</td>
        <td><button class="btn-dl" onclick="apiDownloadExcel('${s.filename}')">⬇ Download</button></td>
        <td><button class="btn-del" onclick="deleteSession('${s.filename}')">🗑</button></td>
      </tr>`).join("");
  } catch (e) {
    document.getElementById("sessions-body").innerHTML =
      `<tr><td colspan="5" class="empty">❌ ${e.message}</td></tr>`;
  }
}

async function deleteSession(filename) {
  if (!confirm(`ลบ ${filename} ?`)) return;
  try {
    await apiDeleteSession(filename);
    loadSessions();
  } catch (e) {
    alert("ลบไม่สำเร็จ: " + e.message);
  }
}

loadSessions();
</script>
</body>
</html>
